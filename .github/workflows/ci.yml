name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test the DSP chain
        run: cargo test --release

      - name: Render the demo set
        run: |
          cargo run --release --example demo_set -- "$RUNNER_TEMP/demo-set.wav" 6
          cargo run --release --example cli -- "$RUNNER_TEMP/demo-set.wav" "$RUNNER_TEMP/out.mp3" mp3
