name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Tauri CLI
        run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --release

      # The macOS app is signed with a Developer ID and notarized by the Tauri
      # bundler; the disk image is then notarized on its own. The Windows
      # installer is not code-signed.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; macOS releases must be signed and notarized."
              exit 1
            fi
          done
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npx tauri build ${{ matrix.args }} --ci

      - name: Collect
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "dist/LUFSy-$VERSION-macOS-arm64.dmg"
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist/LUFSy-$VERSION-Windows-x64-setup.exe"
          fi
          ls -l dist

      - name: Notarize the disk image
        if: runner.os == 'macOS'
        run: |
          dmg="dist/LUFSy-$VERSION-macOS-arm64.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$dmg"

      - name: Verify signature and notarization
        if: runner.os == 'macOS'
        run: |
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          dmg="dist/LUFSy-$VERSION-macOS-arm64.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          awk -v version="$version" '
            $0 ~ "^## " version " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ### Download

          | System | File |
          | --- | --- |
          | Apple Silicon (arm64), macOS 11 or newer | \`LUFSy-$version-macOS-arm64.dmg\` |
          | Windows 10/11, 64-bit | \`LUFSy-$version-Windows-x64-setup.exe\` |

          Verify downloads against \`SHA256SUMS.txt\`.

          The macOS app and disk image are signed with a Developer ID and notarized by Apple.
          The Windows installer is not code-signed; choose *More info* → *Run anyway* in the
          SmartScreen dialog.
          NOTES
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-pushed tag refreshes the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "LUFSy $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "LUFSy $VERSION" --notes-file notes.md --verify-tag
          fi
