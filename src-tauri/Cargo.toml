[package]
name = "lufsy"
version = "0.1.1"
description = "LUFSy – gleicht die Lautstärke aufgenommener DJ-Sets nachträglich an"
authors = ["Philip Mohr"]
license = "MIT"
repository = "https://github.com/BTFLV/LUFSy"
edition = "2021"

[lib]
name = "lufsy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all"] }
ebur128 = "0.1"
hound = "3.5"
mp3lame-encoder = "0.2"

# DSP in debug builds would be painfully slow on multi-hour sets.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
